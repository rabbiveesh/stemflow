name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The CUDA path is compile-checked only; there's no GPU on the runner.
      - run: cargo clippy --all-targets --features cuda -- -D warnings
      - run: cargo test --release

  numerics:
    # End to end against PyTorch: export htdemucs_ft's bass model to ONNX, then check
    # that the Rust STFT + ONNX Runtime + iSTFT pipeline reproduces demucs' forward.
    name: verify vs PyTorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Cache exported model + demucs weights
        uses: actions/cache@v6
        with:
          path: |
            models
            ~/.cache/torch/hub/checkpoints
          key: model-${{ hashFiles('tools/export_htdemucs.py', 'tools/setup-export-env.sh') }}
      - name: Export model
        run: |
          if [ ! -f models/htdemucs_ft_bass.onnx ]; then
            tools/setup-export-env.sh
            cd tools && .venv/bin/python -I export_htdemucs.py ../models
          fi
      - name: Fetch ONNX Runtime (CPU)
        run: tools/fetch-ort.sh cpu
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo build --release
      - run: ./target/release/stemflow verify
