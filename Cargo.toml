[package]
name = "stemflow"
version = "0.1.0"
edition = "2021"
description = "Live bass isolation for whatever your desktop is playing (Demucs via ONNX Runtime, PipeWire/PulseAudio I/O)"
license = "MIT"
repository = "https://github.com/rabbiveesh/stemflow"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
hound = "3"
# ONNX Runtime is loaded at runtime from vendor/ (fetched from Microsoft's GitHub
# releases by tools/fetch-ort.sh); ort's own CDN download is not used.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
realfft = "3"
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
libpulse-binding = "2"
libpulse-simple-binding = "2"

# Core Audio process taps (macOS 14.2+) for capture, an aggregate device for playback.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "coreml"] }
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-ml = "0.3"
objc2-foundation = "0.3"
rtrb = "0.4"
rubato = "1"
audioadapter-buffers = "2"

[features]
default = []
cuda = ["ort/cuda"]

[profile.release]
debug = 1

[build-dependencies]
# Compiles the vendored Signalsmith Stretch (third_party/signalsmith) for src/stretch.rs.
cc = "1"

[dev-dependencies]
proptest = "1"

# The simulator's sessions (src/loopdeck/sim.rs) analyse minutes of audio.
[profile.test]
opt-level = 1
