[package]
name = "stemflow-core"
version = "0.1.0"
edition = "2021"
description = "stemflow's separator, streaming and mixing as a JNI library for the Android app"
license = "MIT"
publish = false

# Built separately with cargo-ndk (see ../README.md); not part of the desktop crate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.21"
# the loop deck and its panel (src/loopdeck), shared with the desktop
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
realfft = "3"
# Only because src/model.rs (shared with the desktop, for the Separator trait and
# MonoFold) also holds the ONNX Runtime separators. Unused at run time here.
clap = { version = "4", features = ["derive"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }

# the loop deck's job thread runs in the background (src/loopdeck/mod.rs)
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[features]
cuda = []
# LiteRT 2.x (CompiledModel + ML Drift GPU accelerator) instead of 1.4.2; see ../README.md.
litert2 = []

[profile.release]
debug = 1
